<style>
.site-nav .nav-group-label { text-align:center; font-size:1.3rem; letter-spacing:0.05em; text-transform:uppercase; color:#2c3e50; margin:0 0 8px; font-weight:bold; }
.site-nav .nav-group-label.radio { color:#1f4e79; display:flex; align-items:center; justify-content:center; gap:10px; }
.site-nav .antenna { width:34px; height:34px; flex:none; }
.site-nav .antenna .wave { fill:none; stroke:#1f4e79; stroke-width:2; stroke-linecap:round; opacity:0; animation:wave 1.8s ease-out infinite; }
.site-nav .antenna .w2 { animation-delay:0.3s; } .site-nav .antenna .w3 { animation-delay:0.6s; }
@keyframes wave { 0% { opacity:0; } 25% { opacity:1; } 100% { opacity:0; } }
@media (prefers-reduced-motion: reduce) { .site-nav .antenna .wave { animation:none; opacity:0.6; } }
.site-nav .nav-bar.radio .nav-link { border-color:#1f4e79; color:#1f4e79; flex:0 1 300px; }
.site-nav .nav-split { max-width:640px; margin:18px auto 20px; border:0; border-top:1px dashed #ccc; }
.site-nav .nav-link.active { background:#2c3e50; color:#fff; }
.site-nav .nav-bar.radio .nav-link.active { background:#1f4e79; color:#fff; }
@media (max-width:600px) { .site-nav .nav-group-label { font-size:1rem; } }
</style>
